[package]
name = "ohm-ecdsa-node"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "OHM-ECDSA M1 transport companion: full-mesh TCP, signed envelopes, echo broadcast (reference code)"
keywords = ["ecdsa", "threshold", "mpc", "tss"]
rust-version = "1.75"

[dependencies]
ohm-ecdsa = { path = ".." }
k256 = { version = "0.13", features = ["ecdsa", "sha256"] }
rand = "0.8"
# M3c (SPEC §13.1): optional mTLS on the mesh. rustls with the ring
# provider (no aws-lc-rs/cmake), TLS 1.3 only; rcgen for test/dev
# self-signed committee certs. MSRV of the pinned tree verified with
# Rust 1.75 (the workspace MSRV).
rustls = { version = "=0.23.43", default-features = false, features = [
    "ring",
    "std",
    "tls12",
] }
rustls-pki-types = { version = "1", features = ["std"] }
rcgen = { version = "=0.14.7", default-features = false, features = [
    "ring",
    "pem",
] }
# Transitive pin (via rcgen): time >= 0.3.5x requires edition2024
# (cargo >= 1.85). 0.3.36 builds with the workspace MSRV 1.75.
time = "=0.3.36"
